[package]
name = "rpod"
version = "0.1.1"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
description = "Fast terminal iPod manager"
repository = "https://github.com/erbator/rPod"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
image = "0.25.10"
libc = "0.2.190"
lofty = "0.25.4"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm", "image-defaults"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
walkdir = "2.5.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
