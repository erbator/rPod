name: Release

# Push a tag like v0.1.0 to build Linux binaries and publish a release. They
# link glibc and ALSA (the player needs it), so they're built on Ubuntu 22.04
# to run on any distro with glibc 2.35 or newer.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Collect third-party licenses
        run: cargo about generate about.hbs -o THIRD_PARTY_LICENSES.md

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rpod LICENSE.md THIRD_PARTY_LICENSES.md dist/
          tar -czf rpod-${{ matrix.target }}.tar.gz -C dist rpod LICENSE.md THIRD_PARTY_LICENSES.md
          sha256sum rpod-${{ matrix.target }}.tar.gz > rpod-${{ matrix.target }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: rpod-${{ matrix.target }}
          path: rpod-${{ matrix.target }}.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
