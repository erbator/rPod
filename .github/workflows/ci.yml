name: CI

# Build the release binary and run the tests on every push, so a broken
# build is caught before tagging a release.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # The player plays through ALSA (PipeWire and PulseAudio sit behind it).
      - name: Install ALSA headers and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev ffmpeg

      - name: Test
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked
