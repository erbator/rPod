# Config for cargo-about, which builds THIRD_PARTY_LICENSES.md for releases:
#   cargo about generate about.hbs -o THIRD_PARTY_LICENSES.md
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "WTFPL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    # Mozilla's CA certificates (webpki-roots), used to verify HTTPS to Apple.
    "CDLA-Permissive-2.0",
    # Symphonia, rodio's MP3/AAC/ALAC decoder; used unmodified.
    "MPL-2.0",
]

# rPod's own license (not a third-party one).
[rpod]
accepted = ["Apache-2.0"]
